[package]
name = "photon"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
bytes = "1.10.1"
thiserror = "2"
parking_lot = "0.12"

[features]
# M0 只落默认集；local / shm / blocking / interceptor / codec-rkyv / full
# 等对应源码存在时再声明，避免空 feature 让 CI 假装通过（design 1.3.1）。
default = ["tcp", "memory"]
tcp = []
memory = []
