[package]
name = "spile-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# method id 只在展开期算，因此不进 spile 的运行期依赖集。
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
