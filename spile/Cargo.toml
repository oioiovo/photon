[package]
name = "spile"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
bytes = "1.10.1"
thiserror = "2"
parking_lot = "0.12"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = "1"
postcard = { version = "1", features = ["alloc"] }
spile-macros = { path = "../spile-macros" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
trybuild = "1"
# 只在测试里用来抓 span 字段（design 3.5 的验收手段），不进主 crate 依赖集。
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[features]
# M0 只落默认集；shm / blocking / interceptor / codec-rkyv / full
# 等对应源码存在时再声明，避免空 feature 让 CI 假装通过（design 1.3.1）。
default = ["tcp", "memory", "codec-postcard"]
tcp = []
memory = []
# 本地 IPC：Unix 搓 UDS，Windows 未实现（开启即编译失败，见 transport.rs）。
local = []
# 默认 codec（postcard，ID = 0）。关掉它就没有 `codec::Default`，宏生成的代码编不过。
codec-postcard = []

# echo 走 TCP，缺少该 feature 时不该尝试构建它。
[[example]]
name = "echo"
required-features = ["tcp"]

# 单进程示例：只需要 memory 与 codec。
[[example]]
name = "local_calc"
required-features = ["memory", "codec-postcard"]

# 跨进程本地 IPC：Unix only（Windows 没有半关闭，`local` 在那里不开）。
[[example]]
name = "calc_local"
required-features = ["local", "codec-postcard"]
